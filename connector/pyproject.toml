[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbo-mcp"
version = "0.1.0"
description = "Read-only MCP server connecting QuickBooks Online Sandbox to Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "python-dotenv==1.1.0",
    "httpx==0.28.1",
    "filelock==3.18.0",
]

[project.scripts]
qbo-mcp       = "qbo_mcp.server:main"
qbo-mcp-auth  = "qbo_mcp.auth.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths    = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
